[package]
name = "servio"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "HTTP server for static files, with live reload, for local development"
authors = ["Alexander Alexandrov"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/alexylon/servio"
documentation = "https://docs.rs/servio"
keywords = ["http", "server", "static-files", "live-reload", "dev-server"]
categories = ["command-line-utilities", "web-programming::http-server", "development-tools"]
publish = true
exclude = [".github/"]

[[bin]]
name = "servio"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
clap = { version = "4", features = ["derive"] }
tower-livereload = "0.10"
notify-debouncer-full = "0.5"
http = "1"

# Only for telling one directory from another; see `directory_id`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
