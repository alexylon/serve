[package]
name = "servio"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "Static file server with live reload for local development"
license = "MIT"
repository = "https://github.com/alexylon/servio"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
clap = { version = "4", features = ["derive"] }
tower-livereload = "0.10"
notify-debouncer-full = "0.5"
http = "1"

# Only for telling one directory from another; see `directory_id`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
